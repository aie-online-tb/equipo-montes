name: Claude a petición

# Responde cuando alguien escribe @claude en una PR o un issue de este repo.
# Solo lee y comenta: tiene prohibido editar, hacer commit o push, así que nunca toca develop ni main.
# Si el secreto no está configurado, el job termina en verde sin hacer nada.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    name: Claude a petición
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Comprobar que hay token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Falta el secreto CLAUDE_CODE_OAUTH_TOKEN. Ver setup/revision-claude.md"
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.hay == 'si'
        with:
          fetch-depth: 1

      - name: Responder
        if: steps.token.outputs.hay == 'si'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git commit:*),Bash(git push:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --append-system-prompt "Responde en español, directo y breve. Lee CLAUDE.md antes de responder. Solo lees y comentas: no haces commits, push ni merges; si te piden un cambio, explica cuál sería y en qué fichero."
